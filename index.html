<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #fff0f5);
            overflow: hidden;
        }

        .box {
            padding: 30px;
        }

        .heart {
            font-size: 70px;
            animation: beat 1s infinite;
        }

        h1 {
            color: #ff3f7f;
            font-size: 42px;
            margin: 15px 0;
        }

        p {
            color: #555;
            font-size: 20px;
            line-height: 1.6;
        }

        @keyframes beat {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: float 5s linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="heart">❤️</div>

        <h1>I LOVE YOU<br>SAYANG 🥺</h1>

        <p>
            I just want you to know...<br>
            I love you so much ❤️<br>
            and I'm really happy to have you in my life.
        </p>

        <div class="heart">💕</div>

    </div>

    <script>
        function createHeart() {
            const heart = document.createElement("div");

            heart.className = "floating-heart";
            heart.innerHTML = "❤️";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (Math.random() * 3 + 3) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 500);
    </script>

</body>
</html>

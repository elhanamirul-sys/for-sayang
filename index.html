<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Sayang ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe1ec, #fff7fa);
            overflow: hidden;
        }

        .box {
            width: 90%;
            max-width: 400px;
        }

        .emoji {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            color: #ff4f8b;
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 19px;
            line-height: 1.5;
        }

        button {
            border: none;
            padding: 14px 25px;
            margin: 10px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.9);
        }

        .main-btn,
        .yes {
            background: #ff4f8b;
            color: white;
        }

        .no {
            background: #e5e5e5;
            color: #444;
        }

        .hidden {
            display: none;
        }

        .final {
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .heart {
            position: absolute;
            bottom: -40px;
            font-size: 25px;
            animation: float 4s linear forwards;
            pointer-events: none;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- PAGE 1 -->
    <div class="box" id="page1">

        <div class="emoji">👀</div>

        <h1>Oi...</h1>

        <p>
            Ada sesuatu nak bagi tengok 👀
        </p>

        <button class="main-btn" onclick="showPage(2)">
            Tengok ❤️
        </button>

    </div>


    <!-- PAGE 2 -->
    <div class="box hidden" id="page2">

        <div class="emoji">😌</div>

        <h1>Hehe...</h1>

        <p>
            Belum habis lagi 😭
        </p>

        <button class="main-btn" onclick="showPage(3)">
            Continue 👀
        </button>

    </div>


    <!-- PAGE 3 -->
    <div class="box hidden" id="page3">

        <div class="emoji">🤨</div>

        <h1>Okay, last one.</h1>

        <p>
            Promise this is the last question 😌
        </p>

        <button class="main-btn" onclick="showPage(4)">
            Okay 🤔
        </button>

    </div>


    <!-- PAGE 4 -->
    <div class="box hidden" id="page4">

        <div class="emoji">😏</div>

        <h1>Do you love me?</h1>

        <button class="yes" onclick="showFinal()">
            YES ❤️
        </button>

        <button class="no" id="noButton">
            NO 😌
        </button>

    </div>


    <!-- FINAL -->
    <div class="box hidden final" id="final">

        <div class="emoji">😂❤️</div>

        <h1>HAHAHA I KNEW IT 😭</h1>

        <p>
            Jangan tipu 😌
        </p>

        <h1>
            I LOVE YOU SAYANG ❤️
        </h1>

        <p>
            Jangan senyum sangat nanti kantoi 🤭
        </p>

        <div style="font-size: 40px;">
            ❤️ 💕 ❤️
        </div>

    </div>


    <script>

        function showPage(pageNumber) {

            document.querySelectorAll(".box")
                .forEach(box => {
                    box.classList.add("hidden");
                });

            document.getElementById("page" + pageNumber)
                .classList.remove("hidden");
        }


        function showFinal() {

            document.querySelectorAll(".box")
                .forEach(box => {
                    box.classList.add("hidden");
                });

            document.getElementById("final")
                .classList.remove("hidden");

            createHearts();
        }


        const noButton = document.getElementById("noButton");

        function moveNoButton(event) {

            event.preventDefault();

            const buttonWidth = noButton.offsetWidth;
            const buttonHeight = noButton.offsetHeight;

            const maxX = window.innerWidth - buttonWidth - 20;
            const maxY = window.innerHeight - buttonHeight - 20;

            const randomX = Math.max(
                10,
                Math.random() * maxX
            );

            const randomY = Math.max(
                10,
                Math.random() * maxY
            );

            noButton.style.position = "fixed";
            noButton.style.left = randomX + "px";
            noButton.style.top = randomY + "px";
        }


        noButton.addEventListener("touchstart", moveNoButton);
        noButton.addEventListener("mouseover", moveNoButton);


        function createHearts() {

            for (let i = 0; i < 25; i++) {

                const heart = document.createElement("div");

                heart.className = "heart";
                heart.innerHTML = "❤️";

                heart.style.left =
                    Math.random() * 100 + "vw";

                heart.style.animationDuration =
                    (Math.random() * 2 + 3) + "s";

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }
        }

    </script>

</body>
</html>
